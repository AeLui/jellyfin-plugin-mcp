- "Jellyfin.Plugin.Mcp.dll"
changelog: >
  Tokens can be limited to chosen libraries: pick them when creating a token
  on the settings page. A restricted token only sees items in those libraries
  (playlists and collections show only their entries from them) and cannot
  have the admin scope. Existing tokens keep access to every library.
