changelog: >
  Audio and subtitle tracks: new jellyfin_get_media_tracks; jellyfin_play can
  start with a chosen audio and subtitle track and jellyfin_playback_control can
  switch them during playback (set_audio_track, set_subtitle_track). New
  read-only admin tools, for administrators only: jellyfin_server_status
  (version, pending restart, activity, disk space), jellyfin_list_all_sessions
  (every user's sessions, with transcoding details) and jellyfin_activity_log.
